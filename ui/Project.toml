[targets]
test = ["Test"]

[compat]
GLMakie = "0.13.13"
PrecompileTools = "1"
Printf = "1.11.0"
julia = "1.10"

# The dev link to the core package, so a fresh clone resolves without a
# `Pkg.develop(path = "..")` by hand (M4 step 5; the gap M3 step 6 recorded when
# deleting `ui/Manifest.toml` left the link living nowhere else). Requires the
# Pkg that ships with Julia ≥ 1.11 to be honoured; older Pkg ignores the section.
# Verified 2026-09-02 on Julia 1.12.6: `ui/Manifest.toml` deleted, `Pkg.instantiate()`
# with NO `Pkg.develop` by hand resolved `GridSim v0.1.0 `..``, and `Pkg.test()` in
# both environments is green (1870 core / 102 ui).
#
# NOTE: `Pkg.add` rewrites this file and DROPS these comments (it did on
# 2026-09-05, adding PrecompileTools). After any Pkg operation on this
# environment, `git diff ui/Project.toml` and put them back.
[sources]
GridSim = {path = ".."}
