[deps]
GLMakie = "e9467ef8-e4e7-5192-8a1a-b1aee30e663a"
GridSim = "eb5af87e-af5a-4058-ac7e-47b2baa55413"
PrecompileTools = "aea7be01-6a6a-4083-8856-8a6e6704d82a"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"

[extras]
